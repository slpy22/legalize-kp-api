# 출처 코드 설명(논문 팀 R3) — law_get/law_versions/law_history 응답의 source_desc 와
# MCP law_sources 도구가 돌려준다. 문구는 잠정이며 수집 담당 확인 뒤 확정.
# label = 화면 배지용 짧은 이름. 정본여부(frontmatter)는 '판본 출처 == nis'(국정원 법령집 수록본)
# 여부라 신뢰도 표시가 아니다 — '비정본' 라벨은 쓰지 않는다(수집 T7-a 합의).
sources:
  mobu:
    name: "법무부"
    label: "법무부 통일법제DB"
    desc: "법무부 통일법제 데이터베이스(unilaw.go.kr) 북한법령 원문(HWP·PDF). 한국 정부가 입력한 원문."
  nis:
    name: "국가정보원"
    label: "국정원 법령집"
    desc: "국가정보원 「2024 북한법령집」 상·하권. 권/쪽은 국정원권·국정원페이지 메타."
  unification:
    name: "통일부"
    label: "통일부 발표"
    desc: "통일부 발표 자료(개별법령 _meta.json source_label)."
  nktechlab:
    name: "NK TechLab"
    label: "NK TechLab"
    desc: "NK TechLab 북한법령 DB(2025-07 공개) — 2024년 판매 북한 스마트폰 앱 「조선민주주의인민공화국 법전」(2024년 중반 현행) 화면 OCR, 미검증 텍스트(띄어쓰기 잡음)."
    unverified: true
# 데이터(저장소·마스터목록)에서 제거된 옛 표기 → 정식명. 수집 측은 옛 오타명을 데이터에
# 남기지 않으므로 옛 URL·질의 대응은 API 가 맡는다(T2 후속 ③). 조회·해석·웹 301 에 공통 사용.
